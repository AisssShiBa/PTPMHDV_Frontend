  /admin/reconciliation/run:
    post:
      tags: [Admin]
      summary: Run an admin reconciliation
      description: |
        `mode` defaults to `quick`. Only one run per mode may be in progress.
        The admin audit row is written before the wallet call; a lost response is
        recorded as UNKNOWN.
      x-backend-service: admin-service
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [quick, full], default: quick }
      responses:
        '200':
          description: Reconciliation report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReconciliationReport' }
        '400':
          description: INVALID_MODE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: RECONCILIATION_IN_PROGRESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: WALLET_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '504':
          description: WALLET_TIMEOUT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/reconciliation/reports:
    get:
      tags: [Admin]
      summary: List reconciliation reports
      x-backend-service: admin-service
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Report page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReconciliationReportPage' }
