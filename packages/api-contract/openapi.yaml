  /api/notifications/socket-ticket:
    $ref: '#/paths/~1notifications~1socket-ticket'
  /api/admin/dashboard:
    $ref: '#/paths/~1admin~1dashboard'
  /api/admin/dashboard/stats:
    $ref: '#/paths/~1admin~1dashboard~1stats'
  /api/admin/kyc:
    $ref: '#/paths/~1admin~1kyc'
  /api/admin/kyc/{userId}/review:
    $ref: '#/paths/~1admin~1kyc~1{userId}~1review'
  /api/admin/kyc/{userId}/status:
