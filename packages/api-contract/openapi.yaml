    $ref: '#/paths/~1admin~1reconciliation~1run'
  /api/admin/reconciliation/reports:
    $ref: '#/paths/~1admin~1reconciliation~1reports'
  /api/admin/reconciliation/reports/{id}:
    $ref: '#/paths/~1admin~1reconciliation~1reports~1{id}'
