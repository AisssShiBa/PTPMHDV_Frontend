  /admin/kyc:
    get:
      tags: [Admin]
      summary: List KYC profiles
      description: |
        `status` is forwarded to user-service as `status`, but user-service reads
        `kycStatus`; the server-side filter is therefore effectively ignored
        today. Tracked in `docs/CONTRACT_OPEN_QUESTIONS.md`.
      x-backend-service: admin-service
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [NONE, PENDING, APPROVED, REJECTED] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: KYC page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminKycPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: KYC_FETCH_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/kyc/{userId}/review:
    post:
      tags: [Admin]
      summary: Approve or reject a KYC profile
      x-backend-service: admin-service
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
                detail: { type: string, maxLength: 500, description: Required when REJECTED }
      responses:
        '200':
          description: Decision applied and audited
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserKycRecord' }
        '400':
          description: VALIDATION_ERROR or INVALID_STATUS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: INVALID_TRANSITION or KYC_DOCUMENTS_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: AUDIT_UNAVAILABLE — nothing was changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/kyc/{userId}/status:
    patch:
      tags: [Admin]
      summary: Same KYC decision (PATCH alias)
      x-backend-service: admin-service
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
