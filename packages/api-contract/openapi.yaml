components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    ClientPlatform:
      name: x-client-platform
      in: header
      required: false
      schema: { type: string, enum: [web, mobile] }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          example: { success: false, error: { code: BAD_REQUEST, message: Request is invalid }, requestId: mock-request-id }
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          example: { success: false, error: { code: INVALID_CREDENTIALS, message: Authentication failed }, requestId: mock-request-id }
    NotFound:
      description: Resource not found
      content:
        application/json:
          example: { success: false, error: { code: NOT_FOUND, message: Resource not found }, requestId: mock-request-id }
    Conflict:
      description: Resource already exists
      content:
        application/json:
          example: { success: false, error: { code: DUPLICATE_RESOURCE, message: Resource already exists }, requestId: mock-request-id }
