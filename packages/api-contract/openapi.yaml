        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: WALLET_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /admin/reconciliation/reports/{id}:
    get:
      tags: [Admin]
      summary: Read one reconciliation report with its anomalies
      x-backend-service: admin-service
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReconciliationReport' }
        '400':
          description: INVALID_REPORT_ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/reconciliation/anomalies/{id}/adjust:
    post:
      tags: [Admin]
      summary: Adjust one reconciliation anomaly
      description: |
        The backend derives a fixed `referenceId = adjust-anomaly-<id>`; the route
        does not accept `Idempotency-Key`. A repeated successful adjustment is
        `409 ALREADY_ADJUSTED`. An UNKNOWN outcome is not retried automatically.
      x-backend-service: admin-service
      parameters:
        - $ref: '#/components/parameters/AnomalyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustAnomalyPayload' }
      responses:
        '200':
          description: Adjustment applied
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AnomalyAdjustmentResult' }
        '400':
          description: INVALID_ANOMALY_ID, INVALID_DIRECTION, INVALID_AMOUNT, REASON_REQUIRED or INVALID_REASON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: ADJUSTMENT_IN_PROGRESS or ALREADY_ADJUSTED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: AUDIT_UNAVAILABLE or ADJUST_OUTCOME_UNKNOWN — reload, never guess
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

