openapi: 3.0.3
info:
  title: FinVault API
  version: 0.2.0
  description: |
    Consolidated contract for the FinVault web client. Every path below was read
    from the real Express routers on Backend `origin/main` (0b78fb5) and matches
    the Gateway mount table in `gateway/src/app.ts`.

    Conventions:
    - Success envelope: `{ success: true, data: <payload>, message?: string }`.
    - Error envelope: `{ success: false, error: { code, message, details? }, requestId? }`.
    - Money is always a decimal string. Never parse it as floating point.
    - Timestamps are ISO-8601 UTC strings.

    Protected routes require a Gateway-signed request: the browser sends
    `Authorization: Bearer <accessToken>`; the Gateway verifies it and forwards an
    `x-gateway-token` to the owning service. `security: []` marks public routes.

    Merchant outlet QR: **QR điểm bán chỉ hiển thị, không có route xác minh trên
    Web.** The contract exposes the signed payload so the portal can render it;
    there is no Web endpoint that validates or redeems it.

    Prism serves path keys directly and does not prepend `servers[].url`, so the
    same path items are repeated under `/api/...` at the end of `paths` (generated
    aliases, not new routes). Routes that do not exist on the Backend are never
    invented: they stay in `x-planned-paths` and are tracked in
    `docs/CONTRACT_OPEN_QUESTIONS.md`.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication, QR sign-in, transaction PIN.
  - name: Users
    description: Profiles, recipient lookup and KYC uploads.
  - name: Merchants
    description: Merchant registration, outlets and API keys.
  - name: Wallets
    description: Wallet balances, ledger, transfers and admin reconciliation.
  - name: Payments
    description: P2P transfers, generic payments and VNPAY top-ups.
  - name: Funding
    description: Cash-out (withdrawal) and VNPAY funding aliases.
  - name: Utilities
    description: Phone top-up and bill payment (simulated providers).
  - name: Notifications
    description: Inbox, read state and the Socket.IO ticket.
  - name: Admin
    description: Dashboard, KYC/merchant review, audit logs and reconciliation.
x-contract-sources:
  - service: auth-service
    routes: services/auth-service/src/routes/{authRoute,pinRoute,qrLoginRoute}.ts
    mount: /api/auth, /api/auth/qr-login, /api/auth/pin (legacy alias /api/auth-txn/pin)
  - service: user-service
    routes: services/user-service/src/routes/userRoute.ts
    mount: /api/users
  - service: merchant-service
    routes: services/merchant-service/src/routes/merchantRoute.ts
    mount: /api/merchants
  - service: wallet-service
    routes: services/wallet-service/src/routes/{wallet,admin}.routes.ts
    mount: /api/wallets, /api/wallets/admin
  - service: payment-service
    routes: services/payment-service/src/routes/{payment,topup,admin-topup}.routes.ts, src/funding/routes/*.ts
    mount: /api/payments, /api/funding
  - service: utilities-service
    routes: services/utilities-service/src/routes/utilityRoute.ts
    mount: /api/utilities
  - service: notification-service
    routes: services/notification-service/src/routes/notificationRoute.ts
    mount: /api/notifications
  - service: admin-service
    routes: services/admin-service/src/routes/adminRoute.ts
    mount: /api/admin
paths:

  # ── Auth ────────────────────────────────────────────────────────────────
  /auth/signup:
    post:
      tags: [Auth]
      summary: Register an account
      security: []
      x-backend-service: auth-service
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, email, firstName, lastName]
              additionalProperties: false
              properties:
                username: { type: string, minLength: 3 }
                password: { type: string, format: password, minLength: 8 }
                email: { type: string, format: email }
                firstName: { type: string }
                lastName: { type: string }
      responses:
        '201':
          description: Account created; `data.userId` is the auth user id and `data.user` the public profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [userId, user]
                        properties:
                          userId: { type: string, format: uuid }
                          user: { $ref: '#/components/schemas/AuthUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/signin:
    post:
      tags: [Auth]
      summary: Sign in with username and password
      security: []
      x-backend-service: auth-service
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string, format: password }
                platform: { type: string, enum: [web, mobile] }
      responses:
        '200':
          description: |
            Signed in. Web clients receive the refresh token in the httpOnly
            `refreshToken` cookie (path `/api/auth`); mobile clients receive it in
            `data.refreshToken`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accessToken, user]
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string, description: Mobile only }
                          user: { $ref: '#/components/schemas/AuthUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the session and issue a new access token
      security: []
      x-backend-service: auth-service
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refreshToken: { type: string, description: Mobile only; web reads the httpOnly cookie }
      responses:
        '200':
          description: Refreshed session (web also rotates the `refreshToken` cookie)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accessToken, user]
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string, description: Mobile only }
                          user: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/signout:
    post:
      tags: [Auth]
      summary: Revoke the refresh-token family and clear the cookie
      security: []
      x-backend-service: auth-service
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      responses:
        '200':
          description: Signed out; `data` is null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/qr-login/init:
    post:
      tags: [Auth]
      summary: Start a QR sign-in session (public, web)
      security: []
      x-backend-service: auth-service
      responses:
        '201':
          description: QR session created. Keep `pollSecret` in memory only; it is required to poll.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QrInit' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/qr-login/{id}/status:
    get:
      tags: [Auth]
      summary: Poll a QR sign-in session
      description: |
        Backend accepts the polling secret as `?pollSecret=` (documented here) or
        the `x-poll-secret` header. The web helper currently sends `?secret=`,
        which the backend ignores; that mismatch is tracked in
        `docs/CONTRACT_OPEN_QUESTIONS.md`. Status values are exactly
        `PENDING | APPROVED | REJECTED`; there is no `SCANNED`, `CONFIRMED` or
        `EXPIRED` status (an expired session is `410 QR_EXPIRED`).
      security: []
      x-backend-service: auth-service
      parameters:
        - $ref: '#/components/parameters/QrId'
        - $ref: '#/components/parameters/PollSecret'
      responses:
        '200':
          description: Current session status; APPROVED also sets the refresh cookie and returns the session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QrStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: QR_EXPIRED — the 120-second session is gone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/qr-login/confirm:
    post:
      tags: [Auth]
      summary: Confirm a scanned QR session (mobile / authenticated client)
      x-backend-service: auth-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrId, nonce]
              additionalProperties: false
              properties:
                qrId: { type: string, format: uuid }
                nonce: { type: string }
      responses:
        '200':
          description: Confirmation recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/pin/setup:
    post:
      tags: [Auth]
      summary: Set the 6-digit transaction PIN for the first time
      description: Auth service also exposes this route as `/api/auth-txn/pin/setup` (legacy alias).
      x-backend-service: auth-service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupPinPayload' }
      responses:
        '201':
          description: PIN created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: PIN_ALREADY_EXISTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/pin/verify:
    post:
      tags: [Auth]
      summary: Verify the transaction PIN and receive a 60-second transaction token
      description: |
        Returns `data.transactionToken` and `data.expiresIn` (seconds). The token is
        sent as `X-Transaction-Token` to payment confirm / cash-out confirm.
      x-backend-service: auth-service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyPinPayload' }
      responses:
        '200':
          description: PIN accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [transactionToken, expiresIn]
                        properties:
                          transactionToken: { type: string }
                          expiresIn: { type: integer, example: 60 }
                          message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: INVALID_PIN — wrong PIN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '423':
          description: PIN_LOCKED — too many failed attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/pin/change:
    post:
      tags: [Auth]
      summary: Change the transaction PIN
      description: Auth service also exposes this route as `/api/auth-txn/pin/change` (legacy alias).
      x-backend-service: auth-service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePinPayload' }
      responses:
        '200':
          description: PIN changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: PIN_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/pin/status:
    get:
      tags: [Auth]
      summary: Read whether the PIN exists and how long it stays locked
      x-backend-service: auth-service
      responses:
        '200':
          description: PIN status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PinStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Users ───────────────────────────────────────────────────────────────
  /users/me:
    get:
      tags: [Users]
      summary: Get the signed-in profile
      x-backend-service: user-service
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: PROFILE_NOT_FOUND — auth account exists but no local profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /users/me/kyc:
    get:
      tags: [Users]
      summary: Get KYC status and tier for the signed-in user
      x-backend-service: user-service
      responses:
        '200':
          description: KYC summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserKycStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: Submit both KYC images for the signed-in user
      x-backend-service: user-service
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [idNumber, front, back]
              properties:
                idNumber: { type: string, maxLength: 50 }
                front: { type: string, format: binary }
                back: { type: string, format: binary }
      responses:
        '202':
          description: 'Documents stored; the profile comes back with kycStatus PENDING'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: KYC_ALREADY_APPROVED / KYC_DOCUMENTS_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: PAYLOAD_TOO_LARGE — each image is capped at 5 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /users/kyc/documents:
    post:
      tags: [Users]
      summary: Submit both KYC images (identity comes from the gateway token)
      x-backend-service: user-service
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [idNumber, front, back]
              properties:
                idNumber: { type: string, maxLength: 50 }
                front: { type: string, format: binary }
                back: { type: string, format: binary }
      responses:
        '202':
          description: Documents stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: KYC state conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: PAYLOAD_TOO_LARGE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /users/lookup:
    get:
      tags: [Users]
      summary: Look up a recipient by exact email or phone
      x-backend-service: user-service
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 254 }
      responses:
        '200':
          description: Masked recipient
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Recipient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Too many lookups; inspect `Retry-After`
          headers:
            Retry-After:
              schema: { type: string, example: '60' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a profile by local profile id or auth user id
      x-backend-service: user-service
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Profile (owner or admin only)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: AMBIGUOUS_IDENTIFIER — use `/users/by-auth/{id}`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /users/by-auth/{id}:
    get:
      tags: [Users]
      summary: Get a profile by auth user id
      x-backend-service: user-service
      parameters:
        - $ref: '#/components/parameters/AuthUserId'
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update the signed-in profile
      x-backend-service: user-service
      parameters:
        - $ref: '#/components/parameters/AuthUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fullName: { type: string, maxLength: 100, nullable: true }
                phone: { type: string, maxLength: 30, nullable: true }
                address: { type: string, maxLength: 500, nullable: true }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Optimistic-concurrency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /users/by-auth/{id}/kyc:
    post:
      tags: [Users]
      summary: Submit KYC images for a specific profile
      x-backend-service: user-service
      parameters:
        - $ref: '#/components/parameters/AuthUserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [idNumber, front, back]
              properties:
                idNumber: { type: string, maxLength: 50 }
                front: { type: string, format: binary }
                back: { type: string, format: binary }
      responses:
        '202':
          description: Documents stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: KYC state conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413':
          description: PAYLOAD_TOO_LARGE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /users/by-auth/{id}/kyc/document:
    get:
      tags: [Users]
      summary: Get a short-lived signed URL for the owner's front KYC image
      x-backend-service: user-service
      parameters:
        - $ref: '#/components/parameters/AuthUserId'
      responses:
        '200':
          description: Signed URL and TTL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/KycDocumentUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN — admins must use `/admin/kyc/{userId}/documents`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: NOT_FOUND — no uploaded document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ── Merchants ───────────────────────────────────────────────────────────
  /merchants:
    get:
      tags: [Merchants]
      summary: List merchants (ADMIN for frontend callers)
      x-backend-service: merchant-service
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
      responses:
        '200':
          description: Paginated merchant list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MerchantPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /merchants/me:
    get:
      tags: [Merchants]
      summary: Get the signed-in owner's merchant registration
      description: 'Returns data null when the owner has not registered; a 404 is an API/deployment error, not a not-registered signal.'
      x-backend-service: merchant-service
      responses:
        '200':
          description: Merchant or explicit null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Merchant'
                          - nullable: true
        '401': { $ref: '#/components/responses/Unauthorized' }

  /merchants/register:
    post:
      tags: [Merchants]
      summary: Register a merchant for the signed-in owner
      x-backend-service: merchant-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName]
              additionalProperties: false
              properties:
                businessName: { type: string, minLength: 1, maxLength: 200 }
                taxId: { type: string, minLength: 1, maxLength: 50, nullable: true }
                bankAccount: { type: string, minLength: 1, maxLength: 100, nullable: true }
                ownerId: { type: string, format: uuid, description: Optional; for frontend callers must equal the signed auth id. Normally omit. }
      responses:
        '201':
          description: Registration created with status PENDING
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Merchant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: MERCHANT_ALREADY_REGISTERED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /merchants/{id}:
    get:
      tags: [Merchants]
      summary: Read a merchant profile as owner or admin
      x-backend-service: merchant-service
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      responses:
        '200':
          description: Merchant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Merchant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Merchants]
      summary: Update a merchant profile as owner or admin
      x-backend-service: merchant-service
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                businessName: { type: string, minLength: 1, maxLength: 200 }
                taxId: { type: string, minLength: 1, maxLength: 50, nullable: true }
                bankAccount: { type: string, minLength: 1, maxLength: 100, nullable: true }
      responses:
        '200':
          description: Updated merchant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Merchant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /merchants/{id}/active:
    get:
      tags: [Merchants]
      summary: Check whether a merchant is active
      x-backend-service: merchant-service
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      responses:
        '200':
          description: Active flag; true only when status is APPROVED
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MerchantActive' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /merchants/{id}/outlets:
    get:
      tags: [Merchants]
      summary: List a merchant's outlets
      x-backend-service: merchant-service
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated outlet list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OutletPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Merchants]
      summary: Create an outlet for an APPROVED merchant
      x-backend-service: merchant-service
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                code:
                  type: string
                  minLength: 3
                  maxLength: 64
                  pattern: '^[A-Za-z0-9_-]+$'
                  description: Globally unique; letters, digits, hyphen and underscore only.
      responses:
        '201':
          description: Outlet created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Outlet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: OUTLET_CODE_TAKEN or merchant not approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /merchants/{id}/outlets/{outletId}/qr:
    get:
      tags: [Merchants]
      summary: Read the signed QR payload for an outlet (display only)
      description: |
        QR điểm bán chỉ hiển thị, không có route xác minh trên Web. The response is
        the signed payload; the web client renders it and never validates it.
      x-backend-service: merchant-service
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/OutletId'
      responses:
        '200':
          description: Signed outlet QR payload
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OutletQr' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /merchants/{id}/api-keys:
    post:
      tags: [Merchants]
      summary: Issue a merchant API key
      description: The raw `data.key` credential is returned only once.
      x-backend-service: merchant-service
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreatedApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /merchants/{id}/api-keys/{keyId}:
    delete:
      tags: [Merchants]
      summary: Revoke a merchant API key
      x-backend-service: merchant-service
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/KeyId'
      responses:
        '200':
          description: Revoked key metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MerchantApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Wallets ─────────────────────────────────────────────────────────────
  /wallets/me:
    get:
      tags: [Wallets]
      summary: Get the signed-in user's wallet
      x-backend-service: wallet-service
      responses:
        '200':
          description: Wallet balances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WalletMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: WALLET_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /wallets/me/ledger:
    get:
      tags: [Wallets]
      summary: Read the signed-in user's ledger with keyset pagination
      x-backend-service: wallet-service
      parameters:
        - name: cursor
          in: query
          schema: { type: string, description: Opaque cursor from the previous page }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Ledger page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LedgerPage' }
        '400':
          description: INVALID_LIMIT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: WALLET_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /wallets/{userId}/balance:
    get:
      tags: [Wallets]
      summary: Read a wallet balance (owner, admin or internal)
      x-backend-service: wallet-service
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OwnerType'
      responses:
        '200':
          description: Balance, held balance and available balance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WalletBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wallets/{userId}/history:
    get:
      tags: [Wallets]
      summary: Read paginated wallet history
      x-backend-service: wallet-service
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OwnerType'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: History page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WalletHistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /wallets/{userId}/credit:
    post:
      tags: [Wallets]
      summary: Credit a wallet (internal service or ADMIN only)
      x-backend-service: wallet-service
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OwnerType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditDebitPayload' }
      responses:
        '200':
          description: Credited
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LedgerMutation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: WALLET_LOCKED or idempotent replay mismatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /wallets/{userId}/debit:
    post:
      tags: [Wallets]
      summary: Debit a wallet (internal service or ADMIN only)
      x-backend-service: wallet-service
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OwnerType'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditDebitPayload' }
      responses:
        '200':
          description: Debited
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LedgerMutation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: INSUFFICIENT_BALANCE or WALLET_LOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /wallets/{userId}/transfer:
    post:
      tags: [Wallets]
      summary: Transfer between wallets (internal service or ADMIN only)
      x-backend-service: wallet-service
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId, amount, referenceId]
              properties:
                toUserId: { type: string, format: uuid }
                amount: { type: string, example: '25000' }
                referenceId: { type: string }
      responses:
        '200':
          description: Transfer completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [fromBalance, toBalance, transactionId, replayed]
                        properties:
                          fromBalance: { type: string }
                          toBalance: { type: string }
                          transactionId: { type: string, format: uuid }
                          replayed: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: INSUFFICIENT_BALANCE, WALLET_LOCKED or CURRENCY_MISMATCH
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /wallets/admin:
    get:
      tags: [Wallets]
      summary: List wallets (ADMIN)
      x-backend-service: wallet-service
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/OwnerType'
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, LOCKED] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Wallet page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WalletPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /wallets/admin/{userId}/lock:
    post:
      tags: [Wallets]
      summary: Lock a wallet (ADMIN)
      x-backend-service: wallet-service
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OwnerType'
      responses:
        '200':
          description: Locked wallet
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WalletView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wallets/admin/{userId}/unlock:
    post:
      tags: [Wallets]
      summary: Unlock a wallet (ADMIN)
      x-backend-service: wallet-service
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OwnerType'
      responses:
        '200':
          description: Unlocked wallet
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WalletView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wallets/admin/{userId}/adjust:
    post:
      tags: [Wallets]
      summary: Apply an audited manual adjustment (ADMIN)
      description: The route does not accept `Idempotency-Key`; dedupe is by `referenceId`.
      x-backend-service: wallet-service
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/OwnerType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, referenceId, direction]
              properties:
                amount: { type: string }
                referenceId: { type: string, minLength: 1 }
                direction: { type: string, enum: [CREDIT, DEBIT] }
                reason: { type: string }
      responses:
        '200':
          description: Adjustment result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [userWallet, transactionId, replayed]
                        properties:
                          userWallet: { $ref: '#/components/schemas/WalletView' }
                          transactionId: { type: string, format: uuid }
                          replayed: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /wallets/admin/reconciliation:
    get:
      tags: [Wallets]
      summary: Run a wallet reconciliation (ADMIN)
      x-backend-service: wallet-service
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [quick, full], default: quick }
        - name: isFull
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Reconciliation report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReconciliationReport' }
        '400':
          description: INVALID_MODE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /wallets/admin/reconciliation/reports:
    get:
      tags: [Wallets]
      summary: List wallet reconciliation reports (ADMIN)
      x-backend-service: wallet-service
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: includeAnomalies
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Report page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReconciliationReportPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /wallets/admin/reconciliation/reports/{id}:
    get:
      tags: [Wallets]
      summary: Read one wallet reconciliation report (ADMIN)
      x-backend-service: wallet-service
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report with anomalies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReconciliationReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wallets/admin/reconciliation/anomalies/{id}/adjust:
    post:
      tags: [Wallets]
      summary: Adjust one wallet anomaly (ADMIN)
      x-backend-service: wallet-service
      parameters:
        - $ref: '#/components/parameters/AnomalyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustAnomalyPayload' }
      responses:
        '200':
          description: Adjustment result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AnomalyAdjustmentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Payments ────────────────────────────────────────────────────────────
  /payments:
    get:
      tags: [Payments]
      summary: List payments visible to the caller
      description: Regular users always see their own payments; only ADMIN may pass `userId` or omit it to see all.
      x-backend-service: payment-service
      parameters:
        - name: userId
          in: query
          schema: { type: string, description: ADMIN only }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/PaymentType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
      responses:
        '200':
          description: Payments (newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payments/p2p/quote:
    post:
      tags: [Payments]
      summary: Quote a P2P wallet transfer (60-second TTL)
      x-backend-service: payment-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationUserId, amount]
              properties:
                destinationUserId: { type: string, format: uuid }
                amount:
                  oneOf:
                    - { type: string, example: '25000' }
                    - { type: number, example: 25000 }
      responses:
        '200':
          description: Quote. `fee` is a JSON number (0), not a string.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/P2pQuote' }
        '400':
          description: INVALID_AMOUNT, SELF_TRANSFER_NOT_ALLOWED or INSUFFICIENT_FUNDS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: DESTINATION_WALLET_NOT_FOUND or SENDER_WALLET_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /payments/p2p/checkout:
    post:
      tags: [Payments]
      summary: Create a P2P transfer payment
      description: Requires `Idempotency-Key`. The same key with a different payload is rejected.
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationUserId, amount]
              properties:
                destinationUserId: { type: string, format: uuid }
                destinationOwnerType: { type: string, enum: [USER, MERCHANT, SYSTEM], default: USER }
                amount: { type: string, example: '25000' }
                note: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Payment created; confirm it with the PIN transaction token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Payment'
                          - type: object
                            properties:
                              replayed: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /payments/checkout:
    post:
      tags: [Payments]
      summary: Create a generic payment (card top-up, tickets, utilities, wallet transfer)
      description: |
        `Idempotency-Key` is required (header or body `idempotencyKey`; both may be
        sent but must match). `PHONE_TOPUP` and `BILL_PAYMENT` were added to the
        backend enum; the web client normally uses `/utilities/*` instead.
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, type]
              properties:
                amount: { type: string, example: '25000' }
                type: { $ref: '#/components/schemas/PaymentType' }
                referenceId: { type: string }
                destinationUserId: { type: string, format: uuid }
                destinationOwnerType: { type: string, enum: [USER, MERCHANT, SYSTEM], default: USER }
                callbackTopic: { type: string, maxLength: 100, default: finvault.events }
                idempotencyKey: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Payment created or replayed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Payment'
                          - type: object
                            properties:
                              replayed: { type: boolean }
        '400':
          description: VALIDATION_ERROR, IDEMPOTENCY_KEY_REQUIRED or IDEMPOTENCY_KEY_MISMATCH
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get payment details
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Payment with status history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{id}/confirm:
    post:
      tags: [Payments]
      summary: Confirm a payment with the PIN transaction token
      description: |
        Send the 60-second token from `/auth/pin/verify` as `X-Transaction-Token`.
        The token is bound to `paymentId` and `amount`.
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/TransactionToken'
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN — token does not match the payment or amount
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: PAYMENT_ALREADY_CONFIRMED or CONFLICT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /payments/{id}/cancel:
    post:
      tags: [Payments]
      summary: Cancel a pending payment and release its hold
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cancelled payment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT — the payment is not PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /payments/topups:
    get:
      tags: [Payments]
      summary: List the signed-in user's top-up requests
      x-backend-service: payment-service
      responses:
        '200':
          description: Top-up requests (newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TopupRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Payments]
      summary: Create a VNPAY top-up and receive the payment URL
      x-backend-service: payment-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 10000, maximum: 100000000, example: 50000 }
      responses:
        '201':
          description: Top-up created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [topupId, paymentUrl]
                        properties:
                          topupId: { type: string, format: uuid }
                          paymentUrl: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payments/topups/{id}:
    get:
      tags: [Payments]
      summary: Get a top-up request status
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Top-up request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TopupRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/topups/vnpay/ipn:
    get:
      tags: [Payments]
      summary: VNPAY IPN callback (public, HMAC-verified)
      description: Returns VNPAY's `{ RspCode, Message }` response, not the FinVault envelope.
      security: []
      x-backend-service: payment-service
      responses:
        '200':
          description: VNPAY acknowledgement
          content:
            application/json:
              schema:
                type: object
                required: [RspCode, Message]
                properties:
                  RspCode: { type: string, example: '00' }
                  Message: { type: string, example: Confirm Success }

  /payments/topups/vnpay/return:
    get:
      tags: [Payments]
      summary: VNPAY browser return (public, read-only)
      description: Verifies the signature and echoes the query parameters; it never credits the wallet.
      security: []
      x-backend-service: payment-service
      responses:
        '200':
          description: Verified VNPAY parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /payments/admin/topups:
    get:
      tags: [Payments]
      summary: List top-up requests for admins
      x-backend-service: payment-service
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TopupStatus' }
      responses:
        '200':
          description: Top-up requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TopupRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/admin/topups/{id}/approve:
    post:
      tags: [Payments]
      summary: Approve a top-up manually (currently disabled by the backend)
      description: |
        The route exists but `TopupService.approveTopup` always throws
        `400 NOT_ALLOWED` because VNPAY IPN owns crediting. The web client keeps
        the button and maps `NOT_ALLOWED` to a Vietnamese explanation.
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '400':
          description: NOT_ALLOWED — manual approval is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/admin/topups/{id}/reject:
    post:
      tags: [Payments]
      summary: Reject a top-up manually (currently disabled by the backend)
      description: Same `400 NOT_ALLOWED` behavior as approve. No `Idempotency-Key` header is accepted.
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '400':
          description: NOT_ALLOWED — manual review is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Funding ─────────────────────────────────────────────────────────────
  /funding/cash-out:
    post:
      tags: [Funding]
      summary: Create a cash-out (withdrawal) request
      description: |
        Requires `Idempotency-Key`. `destination` is optional because the payout
        destination contract is not settled. Confirm with the PIN transaction
        token; poll `GET /funding/cash-out/{id}` after a timeout instead of
        retrying with a new key.
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: string
                  pattern: '^\d+$'
                  maxLength: 18
                  description: Positive integer VND string
                destination: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Cash-out created or replayed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CashOut' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Wallet hold conflict (insufficient funds / locked wallet)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: CASHOUT_PROCESSING — query the status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /funding/cash-out/{id}/confirm:
    post:
      tags: [Funding]
      summary: Confirm a cash-out with the PIN transaction token
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/TransactionToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionToken: { type: string, description: Fallback only; header takes precedence }
      responses:
        '200':
          description: Cash-out succeeded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CashOut' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CASHOUT_FAILED with `failureReason`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: CASHOUT_PROCESSING or CASHOUT_PAYOUT_PENDING — query the status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /funding/cash-out/{id}:
    get:
      tags: [Funding]
      summary: Read a cash-out status
      x-backend-service: payment-service
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cash-out view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CashOut' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /funding/vnpay:
    post:
      tags: [Funding]
      summary: Create a VNPAY top-up through the funding alias
      description: Thin alias over the same `TopupService` used by `/payments/topups`.
      x-backend-service: payment-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 10000, maximum: 100000000 }
      responses:
        '201':
          description: Top-up created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [topupId, paymentUrl]
                        properties:
                          topupId: { type: string, format: uuid }
                          paymentUrl: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /funding/vnpay/create:
    post:
      tags: [Funding]
      summary: Create a VNPAY top-up (explicit `/create` alias)
      x-backend-service: payment-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 10000, maximum: 100000000 }
      responses:
        '201':
          description: Top-up created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [topupId, paymentUrl]
                        properties:
                          topupId: { type: string, format: uuid }
                          paymentUrl: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /funding/vnpay/ipn:
    get:
      tags: [Funding]
      summary: VNPAY IPN callback through the funding alias (public)
      security: []
      x-backend-service: payment-service
      responses:
        '200':
          description: VNPAY acknowledgement
          content:
            application/json:
              schema:
                type: object
                required: [RspCode, Message]
                properties:
                  RspCode: { type: string }
                  Message: { type: string }

  /funding/vnpay/return:
    get:
      tags: [Funding]
      summary: VNPAY browser return through the funding alias (public)
      security: []
      x-backend-service: payment-service
      responses:
        '200':
          description: Verified VNPAY parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ── Utilities ───────────────────────────────────────────────────────────
  /utilities/topup:
    post:
      tags: [Utilities]
      summary: Create a phone top-up order (simulated provider)
      description: Requires `Idempotency-Key`. The allowed amounts are fixed denominations.
      x-backend-service: utilities-service
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, amount]
              properties:
                phone: { type: string, example: '0912345678' }
                amount:
                  type: string
                  enum: ['10000', '20000', '50000', '100000', '200000', '500000']
      responses:
        '201':
          description: Order created; `paymentId` points at the pending payment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UtilityOrder' }
        '200':
          description: 'Replayed the same idempotency key; replayed is true'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UtilityOrder' }
        '400':
          description: VALIDATION_ERROR, IDEMPOTENCY_KEY_REQUIRED, INVALID_PHONE or INVALID_AMOUNT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /utilities/bills/lookup:
    get:
      tags: [Utilities]
      summary: Look up a simulated bill
      x-backend-service: utilities-service
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 32 }
        - name: customerCode
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
      responses:
        '200':
          description: Bill details with `amountFormatted`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BillLookup' }
        '400':
          description: INVALID_PROVIDER or INVALID_CUSTOMER_CODE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: BILL_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '504':
          description: PROVIDER_TIMEOUT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /utilities/bills/pay:
    post:
      tags: [Utilities]
      summary: Pay a simulated bill
      description: Requires `Idempotency-Key`. `amount` must exactly match the looked-up bill.
      x-backend-service: utilities-service
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, customerCode, amount]
              properties:
                provider: { type: string }
                customerCode: { type: string }
                amount: { type: string, example: '35000' }
      responses:
        '201':
          description: Order created; `paymentId` points at the pending payment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UtilityOrder' }
        '200':
          description: 'Replayed the same idempotency key; replayed is true'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UtilityOrder' }
        '400':
          description: VALIDATION_ERROR or IDEMPOTENCY_KEY_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: BILL_AMOUNT_MISMATCH or IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /utilities/orders/{id}:
    get:
      tags: [Utilities]
      summary: Get a utility order status
      x-backend-service: utilities-service
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Order view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UtilityOrder' }
        '400':
          description: VALIDATION_ERROR — `orderId` must be a UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Notifications ───────────────────────────────────────────────────────
  /notifications/me:
    get:
      tags: [Notifications]
      summary: List the signed-in user's notifications
      description: Server-side pagination only; `type`/`unread` filters are not supported (the web page filters loaded pages).
      x-backend-service: notification-service
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated inbox with unread count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/me/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all of the signed-in user's notifications read
      x-backend-service: notification-service
      responses:
        '200':
          description: Number of updated notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [updatedCount]
                        properties:
