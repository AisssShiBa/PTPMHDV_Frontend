        '200':
          description: Decision applied
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserKycRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/kyc/{userId}/tier:
    patch:
      tags: [Admin]
      summary: Change an approved profile's KYC tier with an audit reason
      x-backend-service: admin-service
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, reason]
              properties:
                tier: { type: integer, enum: [1, 2] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Tier changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserKycRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: KYC must be APPROVED first / invalid transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

