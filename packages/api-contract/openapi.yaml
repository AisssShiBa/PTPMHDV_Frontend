# No Web route is currently known to be missing from the Backend. If that
# changes, add the path here AND record it in docs/CONTRACT_OPEN_QUESTIONS.md
# with the owning service. The extension is intentionally empty rather than
# holding invented routes.
x-planned-paths: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuthUserId:
      name: id
      in: path
      required: true
      description: Auth user id (UUID) used by `/users/by-auth/{id}`
      schema: { type: string, format: uuid }
    MerchantId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MerchantIdParam:
      name: merchantId
      in: path
      required: true
      description: Merchant id used by the `/admin/merchants/{merchantId}/...` routes
      schema: { type: string, format: uuid }
    OutletId:
      name: outletId
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AnomalyId:
      name: id
      in: path
      required: true
      schema: { type: string, description: Positive integer serialized as a string }
    QrId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    ClientPlatform:
      name: x-client-platform
      in: header
      required: false
      schema: { type: string, enum: [web, mobile] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    TransactionToken:
      name: X-Transaction-Token
      in: header
      required: true
      schema: { type: string }
    PollSecret:
      name: pollSecret
      in: query
      required: true
      description: Secret from `/auth/qr-login/init`. The `x-poll-secret` header is also accepted.
      schema: { type: string }
    OwnerType:
      name: ownerType
      in: query
      schema: { type: string, enum: [USER, MERCHANT, SYSTEM], default: USER }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Authentication failed or missing
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: The caller does not own the resource or lacks the role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Duplicate or conflicting state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: Upstream dependency unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
        data: {}
        message: { type: string }

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: {}
        requestId: { type: string }

    AuthUser:
      type: object
      required: [id, username, email, firstName, lastName, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string, enum: [USER, ADMIN] }

    UserProfile:
      type: object
      required: [id, authUserId, email, kycStatus, kycTier, hasKycDocument, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        authUserId: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        kycStatus: { type: string, enum: [NONE, PENDING, APPROVED, REJECTED] }
        kycTier: { type: integer, minimum: 0, maximum: 2 }
        idNumber: { type: string, nullable: true }
        hasKycDocument: { type: boolean }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }

    UserKycStatus:
      type: object
      required: [kycStatus, kycTier, hasKycDocument]
      properties:
        kycStatus: { type: string, enum: [NONE, PENDING, APPROVED, REJECTED] }
        kycTier: { type: integer }
        hasKycDocument: { type: boolean }
        kycRejectReason: { type: string, description: Present only when REJECTED }

    UserKycRecord:
      type: object
      required: [id, authUserId, email, kycStatus, kycTier, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        authUserId: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        kycStatus: { type: string, enum: [NONE, PENDING, APPROVED, REJECTED] }
        kycTier: { type: integer }
        idNumber: { type: string, nullable: true }
        idImageUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    KycDocumentUrl:
      type: object
      required: [url, expiresIn]
      properties:
        url: { type: string, format: uri }
        expiresIn: { type: integer, example: 300 }

    KycDocuments:
      type: object
      required: [frontUrl, backUrl, expiresAt]
      properties:
        frontUrl: { type: string, format: uri }
        backUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    Recipient:
      type: object
      required: [authUserId, maskedName]
      properties:
        authUserId: { type: string, format: uuid }
        maskedName: { type: string, example: 'N*** V** A' }

    QrInit:
      type: object
      required: [qrId, nonce, pollSecret, expiresAt]
      properties:
        qrId: { type: string, format: uuid }
        nonce: { type: string }
        pollSecret: { type: string, description: Keep in memory only }
        expiresAt: { type: string, format: date-time }

    QrStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        accessToken: { type: string, description: Present only for APPROVED }
        user: { $ref: '#/components/schemas/AuthUser' }

    SetupPinPayload:
      type: object
      required: [pin, confirmPin]
      additionalProperties: false
      properties:
        pin: { type: string, pattern: '^\d{6}$' }
        confirmPin: { type: string, pattern: '^\d{6}$' }

    VerifyPinPayload:
      type: object
      required: [pin, paymentId, amount]
      additionalProperties: false
      properties:
        pin: { type: string, pattern: '^\d{6}$' }
        paymentId: { type: string }
        amount:
          oneOf:
            - { type: string, pattern: '^\d+$' }
            - { type: number, minimum: 1 }

    ChangePinPayload:
      type: object
      required: [oldPin, newPin, confirmNewPin]
      additionalProperties: false
      properties:
        oldPin: { type: string, pattern: '^\d{6}$' }
        newPin: { type: string, pattern: '^\d{6}$' }
        confirmNewPin: { type: string, pattern: '^\d{6}$' }

    PinStatus:
      type: object
      required: [hasPin, isLocked, remainingLockSeconds]
      properties:
        hasPin: { type: boolean }
        isLocked: { type: boolean }
        remainingLockSeconds: { type: integer, minimum: 0 }

    Merchant:
      type: object
      required: [id, ownerId, businessName, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        businessName: { type: string }
        taxId: { type: string, nullable: true }
        bankAccount: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }

    MerchantActive:
      type: object
      required: [id, ownerId, businessName, status, active]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        businessName: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        active: { type: boolean, description: True only when status is APPROVED }

    MerchantPage:
      type: object
      required: [content, page, limit, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Merchant' }
        page: { type: integer }
        limit: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer, minimum: 1 }

    Outlet:
      type: object
      required: [id, merchantId, name, code, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        merchantId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OutletPage:
      type: object
      required: [content, page, limit, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Outlet' }
        page: { type: integer }
        limit: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer, minimum: 1 }

    OutletQr:
      type: object
      required: [version, merchantId, outletId, outletCode, issuedAt, token, signature, algorithm]
      properties:
        version: { type: integer, enum: [1] }
        merchantId: { type: string, format: uuid }
        outletId: { type: string, format: uuid }
        outletCode: { type: string }
        issuedAt: { type: integer, description: Unix epoch milliseconds }
        token: { type: string }
        signature: { type: string }
        algorithm: { type: string, enum: [HMAC-SHA256] }

    MerchantApiKey:
      type: object
      required: [id, keyId, prefix, createdAt]
      properties:
        id: { type: string, format: uuid }
        keyId: { type: string, format: uuid }
        prefix: { type: string, description: Public display fragment; not a credential }
        revokedAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    CreatedApiKey:
      allOf:
        - $ref: '#/components/schemas/MerchantApiKey'
        - type: object
          required: [key]
          properties:
            key: { type: string, description: Raw `<keyId>.<secret>`; returned only once }

    WalletMe:
      type: object
      required: [id, userId, balance, heldBalance, availableBalance, currency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        balance: { type: string, example: '1250000.00' }
        heldBalance: { type: string }
        availableBalance: { type: string }
        currency: { type: string, enum: [VND] }
        status: { type: string, enum: [ACTIVE, LOCKED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WalletView:
      type: object
      required: [id, userId, ownerType, balance, heldBalance, availableBalance, currency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        ownerType: { type: string, enum: [USER, MERCHANT, SYSTEM] }
        systemCode: { type: string, nullable: true }
        balance: { type: string }
        heldBalance: { type: string }
        availableBalance: { type: string }
        currency: { type: string, enum: [VND] }
        status: { type: string, enum: [ACTIVE, LOCKED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WalletBalance:
      type: object
      required: [balance, heldBalance, availableBalance, currency, status]
      properties:
        balance: { type: string }
        heldBalance: { type: string }
        availableBalance: { type: string }
        currency: { type: string, enum: [VND] }
        status: { type: string, enum: [ACTIVE, LOCKED] }

    WalletPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WalletView' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    LedgerItem:
      type: object
      required: [id, transactionId, direction, amount, balanceAfter, referenceId, transferType, createdAt]
      properties:
        id: { type: string, description: BigInt serialized as a string }
        transactionId: { type: string, format: uuid }
        direction: { type: string, enum: [CREDIT, DEBIT] }
        amount: { type: string }
        balanceAfter: { type: string }
        referenceId: { type: string }
        transferType: { type: string, enum: [TOPUP, PAYMENT, REFUND, P2P_TRANSFER, ADJUSTMENT] }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    LedgerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LedgerItem' }
        nextCursor: { type: string, nullable: true }

    WalletHistoryPage:
      type: object
      required: [items, total, page, limit, from, to]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LedgerItem' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    LedgerMutation:
      type: object
      required: [balance, transactionId, replayed]
      properties:
        balance: { type: string }
        transactionId: { type: string, format: uuid }
        replayed: { type: boolean }

    CreditDebitPayload:
      type: object
      required: [amount, referenceId]
      properties:
        amount: { type: string }
        referenceId: { type: string }
        transferType: { type: string, enum: [TOPUP, PAYMENT, REFUND, P2P_TRANSFER, ADJUSTMENT] }
        systemCode: { type: string, enum: [MAIN, FEE, CLEARING_TOPUP, SETTLEMENT] }

    PaymentType:
      type: string
      enum: [CARD_TOPUP, BUS_TICKET, MOVIE_TICKET, TRAIN_TICKET, WALLET_TRANSFER, PHONE_TOPUP, BILL_PAYMENT]

    PaymentStatus:
      type: string
      enum: [PENDING, PROCESSING, SUCCESS, FAILED, REFUNDED, REFUNDING, REFUND_FAILED, CANCELLED, EXPIRED]

    Payment:
      type: object
      required: [id, userId, amount, type, referenceId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        amount: { type: string, example: '25000.00' }
        type: { $ref: '#/components/schemas/PaymentType' }
        referenceId: { type: string }
        destinationUserId: { type: string, nullable: true }
        destinationOwnerType: { type: string, nullable: true, enum: [USER, MERCHANT, SYSTEM] }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        failureReason: { type: string, nullable: true }
        failureCode: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        histories:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              fromStatus: { type: string, nullable: true }
              toStatus: { type: string }
              note: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }

    P2pQuote:
      type: object
      required: [destinationUserId, amount, fee, expiresAt]
      properties:
        destinationUserId: { type: string, format: uuid }
        amount: { type: string }
        fee: { type: number, example: 0, description: 'JSON number; not a string' }
        expiresAt: { type: string, format: date-time }

    TopupStatus:
      type: string
      enum: [PENDING, PROCESSING, APPROVED, REJECTED, EXPIRED, FAILED]

    TopupRequest:
      type: object
      required: [id, userId, amount, code, status, expiresAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        amount: { type: string, example: '50000.00' }
        code: { type: string }
        status: { $ref: '#/components/schemas/TopupStatus' }
        expiresAt: { type: string, format: date-time }
        approvedBy: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        rejectReason: { type: string, nullable: true }
        walletTransactionId: { type: string, format: uuid, nullable: true }
        vnpTransactionNo: { type: string, nullable: true }
        vnpBankCode: { type: string, nullable: true }
        vnpPayDate: { type: string, nullable: true }
        vnpResponseCode: { type: string, nullable: true }
        paymentUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CashOut:
      type: object
      required: [id, userId, amount, destination, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        amount: { type: string, example: '200000' }
        destination: { type: string, nullable: true }
        status: { type: string, enum: [REQUESTED, HOLDING, PAYOUT_PENDING, SUCCEEDED, FAILED] }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        replayed: { type: boolean }

    BillLookup:
      type: object
      required: [provider, customerCode, customerName, amount, period, amountFormatted]
      properties:
        provider: { type: string }
        customerCode: { type: string }
        customerName: { type: string }
        amount: { type: string, example: '35000' }
        period: { type: string, example: '2026-10' }
        amountFormatted: { type: string, example: '35.000đ' }

    UtilityOrder:
      type: object
      required: [orderId, type, status, amount, discountAmount, target, createdAt, updatedAt]
      properties:
        orderId: { type: string, format: uuid }
        type: { type: string, enum: [TELCO_TOPUP, BILL_PAY] }
        status:
          type: string
          enum: [PENDING_PAYMENT, PAID, PROVIDER_PENDING, SUCCESS, FAILED, REFUND_REQUESTED, REFUNDED, REFUND_FAILED]
        amount: { type: string }
        discountAmount: { type: string, description: Stored only; the backend does not deduct or credit it }
        target: { type: string, description: Normalised phone number or customer code }
        providerCode: { type: string, nullable: true }
        providerRef: { type: string, nullable: true }
        paymentId: { type: string, format: uuid, nullable: true }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        replayed: { type: boolean }

    Notification:
      type: object
      required: [id, userId, type, message, read, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, nullable: true, description: 'Outbox/inbox event id; used for realtime dedupe' }
        userId: { type: string }
        type:
          type: string
          enum:
            - PAYMENT_SUCCESS
            - PAYMENT_FAILED
            - PAYMENT_EXPIRED
            - PAYMENT_REFUNDED
            - PAYMENT_CANCELLED
            - WALLET_CREDITED
            - WALLET_DEBITED
            - KYC_APPROVED
            - KYC_REJECTED
            - KYC_TIER_CHANGED
            - MERCHANT_APPROVED
            - MERCHANT_REJECTED
            - TOPUP_SUCCEEDED
            - CASHOUT_SUCCEEDED
            - CASHOUT_FAILED
            - UTILITY_SUCCEEDED
            - UTILITY_FAILED
            - UTILITY_REFUNDED
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

    NotificationPage:
      type: object
      required: [notifications, unreadCount, pagination]
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unreadCount: { type: integer }
        pagination:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    SocketTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket: { type: string }
        expiresAt: { type: string, format: date-time }

    AdminDashboardStats:
      type: object
      required: [users, merchants, audits]
      properties:
        users:
          type: object
          required: [total, kycBreakdown]
          properties:
            total: { type: integer }
            kycBreakdown:
              type: object
              required: [none, pending, approved, rejected]
              properties:
                none: { type: integer }
                pending: { type: integer }
                approved: { type: integer }
                rejected: { type: integer }
        merchants:
          type: object
          required: [total, statusBreakdown]
          properties:
            total: { type: integer }
            statusBreakdown:
              type: object
              required: [pending, approved, rejected]
              properties:
                pending: { type: integer }
                approved: { type: integer }
                rejected: { type: integer }
        audits:
          type: object
          required: [totalLogs, todayActionsCount, recentActivities]
          properties:
            totalLogs: { type: integer }
            todayActionsCount: { type: integer }
            recentActivities:
              type: array
              items: { $ref: '#/components/schemas/AdminAuditLog' }

    AdminKycPage:
      type: object
      required: [content, page, limit, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/UserKycRecord' }
        page: { type: integer }
        limit: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer, minimum: 1 }

    AdminAuditLog:
      type: object
      required: [id, adminId, action, targetId, createdAt]
      properties:
        id: { type: string, format: uuid }
        adminId: { type: string }
        action: { type: string, example: APPROVE_KYC }
        targetId: { type: string }
        detail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    AdminAuditLogPage:
      type: object
      required: [content, page, limit, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AdminAuditLog' }
        page: { type: integer }
        limit: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    ReconciliationAnomaly:
      type: object
      required: [id, type, walletId, detail]
      properties:
        id: { type: string, description: BigInt serialized as a string }
        type: { type: string, example: NEGATIVE_BALANCE }
        walletId: { type: integer }
        detail: { type: object, additionalProperties: true }

    ReconciliationReport:
      type: object
      required: [id, runAt, totalWallets, anomaliesFound, systemBalanceExpected, systemBalanceActual, isBalanced, anomalies]
      properties:
        id: { type: integer, description: Wallet report id or admin run log id }
        runAt: { type: string, format: date-time }
        totalWallets: { type: integer }
        anomaliesFound: { type: integer }
        systemBalanceExpected: { type: string }
        systemBalanceActual: { type: string }
        isBalanced: { type: boolean }
        anomalies:
          type: array
          items: { $ref: '#/components/schemas/ReconciliationAnomaly' }

    ReconciliationReportPage:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReconciliationReport' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    AdjustAnomalyPayload:
      type: object
      required: [direction, amount, reason]
      additionalProperties: false
      properties:
        direction: { type: string, enum: [CREDIT, DEBIT] }
        amount: { type: string, pattern: '^\d+$', example: '50000' }
        reason: { type: string, minLength: 5, maxLength: 500 }

    AnomalyAdjustmentResult:
      type: object
      required: [anomalyId, status, referenceId]
      properties:
        anomalyId: { type: string }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, UNKNOWN] }
        referenceId: { type: string, example: adjust-anomaly-123 }
        transactionId: { type: string, format: uuid }
        replayed: { type: boolean }
