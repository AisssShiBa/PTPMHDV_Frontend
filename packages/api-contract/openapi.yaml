    $ref: '#/paths/~1utilities~1bills~1pay'
  /api/utilities/orders/{id}:
    $ref: '#/paths/~1utilities~1orders~1{id}'
  /api/notifications/me:
    $ref: '#/paths/~1notifications~1me'
  /api/notifications/me/read-all:
    $ref: '#/paths/~1notifications~1me~1read-all'
  /api/notifications/{id}/read:
